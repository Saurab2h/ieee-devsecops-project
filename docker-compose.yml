version: "3.8"

# ============================================================
# docker-compose.yml — Jenkins DevSecOps Stack
#
# Usage:
#   docker-compose up -d          # start Jenkins
#   docker-compose down           # stop Jenkins
#   docker-compose build jenkins  # rebuild after Dockerfile changes
#
# Jenkins UI: http://localhost:8080
# ============================================================

services:

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: devsecops-jenkins:latest
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8082:8080"    # Jenkins UI
      - "50002:50000"  # Agent JNLP port

    volumes:
      # Persist Jenkins home across restarts
      - jenkins_home:/var/jenkins_home
      # Mount Docker socket so Jenkins can run Docker commands on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the project workspace directly so pipelines can reference it
      - .:/workspace

    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

    # Give Jenkins access to the docker group on the host
    group_add:
      - "${DOCKER_GID:-999}"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3005:3000"
    depends_on:
      - prometheus

volumes:
  jenkins_home:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
